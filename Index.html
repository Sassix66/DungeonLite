<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>DungeonLite</title>
  <style>
    :root{--bg:#0b1020;--panel:#151d31;--panel2:#202b45;--text:#f3f4f6;--muted:#aab3c5;--accent:#7cba6b;--gold:#d7ad55;--danger:#d95c5c;--line:rgba(255,255,255,.09);--radius:16px}
    *{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{min-height:100vh;margin:0;color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top,rgba(70,95,140,.22),transparent 42%),linear-gradient(180deg,#11182a 0%,var(--bg) 55%)}button{font:inherit}#app{width:min(100%,720px);min-height:100vh;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}.screen{animation:enter .22s ease}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.brand{padding:52px 12px 30px;text-align:center}.brand h1{margin:0;font-size:clamp(2.7rem,13vw,5rem);letter-spacing:-.055em;color:#f1cf7a}.brand p{margin:10px 0 0;color:var(--muted)}.panel{padding:20px;border:1px solid var(--line);border-radius:var(--radius);background:rgba(21,29,49,.94);box-shadow:0 24px 60px rgba(0,0,0,.26)}.menu,.actions{display:grid;gap:11px}.btn{width:100%;min-height:52px;padding:13px 16px;border:0;border-radius:13px;color:#0b1020;background:var(--accent);font-weight:750;cursor:pointer;touch-action:manipulation}.btn:active{transform:scale(.985)}.btn.secondary{color:var(--text);background:var(--panel2)}.btn.gold{color:#211a08;background:var(--gold)}.btn.danger{color:white;background:var(--danger)}.btn:disabled{opacity:.45}.topbar{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-bottom:14px}.topbar h2{margin:0}.muted{color:var(--muted)}.tiny{font-size:.82rem}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.stat{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}.stat b{display:block;font-size:1.05rem}.stat span{color:var(--muted);font-size:.78rem}.bar{height:12px;overflow:hidden;margin-top:7px;border-radius:999px;background:rgba(0,0,0,.3)}.fill{height:100%;background:var(--accent)}.fill.hp{background:var(--danger)}.fill.xp{background:#7289da}.enemy{margin:14px 0;padding:20px;text-align:center;border:1px solid rgba(217,92,92,.28);border-radius:var(--radius);background:linear-gradient(180deg,rgba(99,33,43,.46),rgba(32,43,69,.92))}.enemy-icon{font-size:3.3rem}.enemy h3{margin:8px 0 3px;font-size:1.45rem}.log{height:155px;overflow:auto;margin:14px 0;padding:13px;border-radius:12px;color:#d8deea;background:rgba(0,0,0,.28);font-size:.9rem;line-height:1.55}.inventory{display:grid;gap:9px;margin:14px 0}.item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}.notice{margin:12px 0;padding:12px;border-left:4px solid var(--gold);border-radius:8px;color:#eadfbf;background:rgba(215,173,85,.08)}footer{padding:24px 0 4px;text-align:center;color:#738099;font-size:.78rem}@media(min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}.actions.two{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<main id="app"></main>
<script>
(()=>{"use strict";const K="dungeonlite.save.v01",app=document.getElementById("app"),E=[{name:"Moorschleim",icon:"🟢",hp:28,attack:7,defense:1,gold:8,xp:12},{name:"Krallenratte",icon:"🐀",hp:36,attack:9,defense:2,gold:11,xp:16},{name:"Höhlenkobold",icon:"👺",hp:48,attack:12,defense:4,gold:17,xp:24},{name:"Knochenwächter",icon:"💀",hp:64,attack:15,defense:6,gold:25,xp:34}],S={player:null,enemy:null,floor:1,log:[]};
const potion=()=>({id:String(Date.now()+Math.random()),name:"Heiltrank",type:"potion",heal:35});
const fresh=()=>({name:"Wanderer",level:1,xp:0,xpNext:50,hp:100,maxHp:100,attack:12,defense:5,gold:0,inventory:[potion()]});
const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const has=()=>!!localStorage.getItem(K);
function menu(msg=""){app.innerHTML=`<section class="screen"><div class="brand"><h1>DungeonLite</h1><p>Ein eigenständiges minimalistisches Dungeon-RPG</p></div><div class="panel">${msg?`<div class="notice">${esc(msg)}</div>`:""}<div class="menu"><button class="btn" id="new">Neues Spiel</button><button class="btn secondary" id="load" ${has()?"":"disabled"}>Spiel laden</button></div></div><footer>Test-Build v0.1 · Speicherung im Browser</footer></section>`;new.onclick=()=>{S.player=fresh();S.floor=1;hub("Dein Abenteuer beginnt.")};load.onclick=()=>{try{let d=JSON.parse(localStorage.getItem(K));S.player=Object.assign(fresh(),d.player||{});S.floor=Math.max(1,+d.floor||1);hub("Spielstand geladen.")}catch{menu("Spielstand konnte nicht geladen werden.")}}}
const card=(l,v)=>`<div class="stat"><b>${esc(v)}</b><span>${esc(l)}</span></div>`;
function hub(msg=""){const p=S.player,h=Math.max(0,Math.min(100,p.hp/p.maxHp*100)),x=Math.max(0,Math.min(100,p.xp/p.xpNext*100));app.innerHTML=`<section class="screen"><div class="topbar"><div><h2>${esc(p.name)}</h2><div class="muted tiny">Dungeon-Etage ${S.floor}</div></div><button class="btn secondary" id="m">Menü</button></div><div class="panel">${msg?`<div class="notice">${esc(msg)}</div>`:""}<div class="stats">${card("Level",p.level)}${card("Gold",p.gold)}${card("Angriff",p.attack)}${card("Verteidigung",p.defense)}</div><div class="stat"><b>HP ${p.hp} / ${p.maxHp}</b><span>Lebenspunkte</span><div class="bar"><div class="fill hp" style="width:${h}%"></div></div></div><div class="stat" style="margin-top:10px"><b>XP ${p.xp} / ${p.xpNext}</b><span>Erfahrung</span><div class="bar"><div class="fill xp" style="width:${x}%"></div></div></div><div class="actions two" style="margin-top:14px"><button class="btn" id="d">Dungeon betreten</button><button class="btn gold" id="i">Inventar (${p.inventory.length})</button><button class="btn secondary" id="s">Speichern</button><button class="btn secondary" id="r" ${p.gold<10||p.hp>=p.maxHp?"disabled":""}>Rasten (10 Gold)</button></div></div></section>`;m.onclick=()=>menu();d.onclick=fight;i.onclick=inventory;s.onclick=()=>{localStorage.setItem(K,JSON.stringify({player:p,floor:S.floor}));hub("Spiel gespeichert.")};r.onclick=()=>{if(p.gold>=10&&p.hp<p.maxHp){p.gold-=10;p.hp=p.maxHp;hub("Du hast dich vollständig erholt.")}}}
function enemy(){const b=E[Math.min(E.length-1,Math.floor((S.floor-1)/2))],q=1+(S.floor-1)*.12,h=Math.round(b.hp*q);return{...b,hp:h,maxHp:h,attack:Math.round(b.attack*q),defense:Math.round(b.defense*q),gold:Math.round(b.gold*q),xp:Math.round(b.xp*q)}}
function fight(){S.enemy=enemy();S.log=[`Etage ${S.floor}: ${S.enemy.name} stellt sich dir entgegen.`];battle()}
const dmg=(a,d)=>Math.max(1,Math.round((a-d*.55)*(.85+Math.random()*.3)));
function battle(){const p=S.player,e=S.enemy,z=Math.max(0,Math.min(100,e.hp/e.maxHp*100));app.innerHTML=`<section class="screen"><div class="topbar"><div><h2>Kampf</h2><div class="muted tiny">Etage ${S.floor}</div></div><div class="tiny">Deine HP: ${p.hp}/${p.maxHp}</div></div><div class="panel"><div class="enemy"><div class="enemy-icon">${e.icon}</div><h3>${esc(e.name)}</h3><div class="muted">Angriff ${e.attack} · Verteidigung ${e.defense}</div><div class="bar"><div class="fill hp" style="width:${z}%"></div></div><div class="tiny muted">${Math.max(0,e.hp)} / ${e.maxHp} HP</div></div><div class="log" id="log">${S.log.map(v=>esc(v)+"<br>").join("")}</div><div class="actions two"><button class="btn danger" id="a">Angreifen</button><button class="btn gold" id="p" ${p.inventory.some(x=>x.type==="potion")?"":"disabled"}>Heiltrank</button></div></div></section>`;a.onclick=turn;p.onclick=()=>{let n=S.player.inventory.findIndex(x=>x.type==="potion");if(n<0)return;let [t]=S.player.inventory.splice(n,1),h=Math.min(t.heal,S.player.maxHp-S.player.hp);S.player.hp+=h;S.log.push(`Du trinkst einen Heiltrank und erhältst ${h} HP.`);battle()};log.scrollTop=log.scrollHeight}
function turn(){const p=S.player,e=S.enemy,c=Math.random()<.14;let h=dmg(p.attack,e.defense)*(c?2:1);e.hp-=h;S.log.push(`${c?"Kritisch! ":""}Du verursachst ${h} Schaden.`);if(e.hp<=0)return win();let g=dmg(e.attack,p.defense);p.hp-=g;S.log.push(`${e.name} verursacht ${g} Schaden.`);if(p.hp<=0){p.hp=Math.max(1,Math.round(p.maxHp*.4));p.gold=Math.max(0,p.gold-Math.round(p.gold*.15));S.floor=1;return hub("Du wurdest besiegt und am Eingang geborgen.")}battle()}
function win(){const p=S.player,e=S.enemy;p.gold+=e.gold;p.xp+=e.xp;let m=`${e.name} besiegt: +${e.gold} Gold, +${e.xp} XP.`;if(Math.random()<.32){p.inventory.push(potion());m+=" Du findest einen Heiltrank."}while(p.xp>=p.xpNext){p.xp-=p.xpNext;p.level++;p.xpNext=Math.round(p.xpNext*1.35);p.maxHp+=16;p.hp=p.maxHp;p.attack+=3;p.defense+=2;m+=` Level ${p.level} erreicht!`}S.floor++;hub(m)}
function inventory(){const p=S.player;app.innerHTML=`<section class="screen"><div class="topbar"><div><h2>Inventar</h2><div class="muted tiny">${p.inventory.length} Gegenstände</div></div><button class="btn secondary" id="b">Zurück</button></div><div class="panel"><div class="inventory">${p.inventory.length?p.inventory.map((t,n)=>`<div class="item"><div><b>${esc(t.name)}</b><div class="muted tiny">Heilt ${t.heal} HP</div></div><button class="btn gold" data-u="${n}" ${p.hp>=p.maxHp?"disabled":""}>Benutzen</button></div>`).join(""):'<p class="muted">Dein Inventar ist leer.</p>'}</div></div></section>`;b.onclick=()=>hub();document.querySelectorAll("[data-u]").forEach(x=>x.onclick=()=>{let n=+x.dataset.u,t=p.inventory[n];if(!t||p.hp>=p.maxHp)return;p.hp+=Math.min(t.heal,p.maxHp-p.hp);p.inventory.splice(n,1);inventory()})}
menu();})();
</script>
</body>
</html>
